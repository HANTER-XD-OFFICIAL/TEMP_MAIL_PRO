services:
  - type: web
    name: temp-mail-pro-telegram-bot
    env: node
    plan: free
    region: singapore # or frankfurt / oregon
    rootDir: telegram-bot
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false # Set privately in Render Dashboard Environment, or uses internal encrypted vault
      - key: NODE_ENV
        value: production
