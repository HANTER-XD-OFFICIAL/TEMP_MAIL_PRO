name: Build & Package Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment Files
        run: |
          echo "Preparing build environment..."
          # Decode debug keystore if base64 file exists
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # Create .env from .env.example if missing
          if [ ! -f ".env" ]; then
            echo "Creating .env configuration..."
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          echo "Building Debug APK directly..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -x test --stacktrace --no-daemon
          else
            gradle assembleDebug -x test --stacktrace --no-daemon
          fi

      - name: Build Release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Building Release APK..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease -x test --stacktrace --no-daemon || ./gradlew assembleDebug -x test --stacktrace --no-daemon
          else
            gradle assembleRelease -x test --stacktrace --no-daemon || gradle assembleDebug -x test --stacktrace --no-daemon
          fi

      - name: Locate and Organize APK Outputs
        run: |
          mkdir -p build-artifacts
          echo "Finding all generated APK files..."
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build-artifacts/ \; || true
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-APK
          path: build-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
