name: Build & Package Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Prepare Keystore & Environment Files
        run: |
          echo "Setting up environment and keystores..."
          # 1. Decode debug.keystore if base64 exists or generate fallback
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup .env
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          echo "Building Debug APK..."
          gradle :app:assembleDebug -x test -x testDebugUnitTest -x lint --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Building Release APK (falls back to Debug if signing keys not provided)..."
          gradle :app:assembleRelease -x test -x testDebugUnitTest -x lint --stacktrace --no-daemon || gradle :app:assembleDebug -x test -x testDebugUnitTest -x lint --stacktrace --no-daemon

      - name: Collect Generated APKs
        run: |
          mkdir -p build-artifacts
          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/ \; || true
          ls -la build-artifacts/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-APK
          path: build-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
